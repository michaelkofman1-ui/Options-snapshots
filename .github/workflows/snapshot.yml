name: options-snapshot

# GitHub can start scheduled runs hours late (on Oct 28 the 21:30 UTC run
# started at 01:06), so there are many short passes at odd minutes. Each only
# replaces a day's file with a better snapshot, so extra or late runs are
# harmless. Times in UTC; New York is UTC-4 in summer time, UTC-5 in winter.
#   20:41 ... 23:41  every 30 min: from 4:41 PM NY (summer) / 3:41 PM (winter)
#                    until before SPX/NDX overnight trading starts at 8:15 PM NY
#   11:07 Tue-Sat    morning catch-up: rescues ETF/stock closes a late night missed
#   12:37 Tue-Sat    check: fails the run if any symbol lacks the last close
on:
  schedule:
    - cron: "41 20 * * 1-5"
    - cron: "11 21 * * 1-5"
    - cron: "41 21 * * 1-5"
    - cron: "11 22 * * 1-5"
    - cron: "41 22 * * 1-5"
    - cron: "11 23 * * 1-5"
    - cron: "41 23 * * 1-5"
    - cron: "7 11 * * 2-6"
    - cron: "37 12 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - snapshot.py
      - symbols.txt
      - requirements.txt
      - .github/workflows/snapshot.yml

permissions:
  contents: write

concurrency:
  group: options-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Take snapshots
        id: snap
        continue-on-error: true
        run: |
          if [ "${{ github.event.schedule }}" = "37 12 * * 2-6" ]; then
            python snapshot.py --require-close
          else
            python snapshot.py
          fi

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 10
          done
          exit 1

      - name: Fail the run if any symbol failed
        if: steps.snap.outcome == 'failure'
        run: |
          echo "One or more symbols failed. See the Take snapshots step."
          exit 1
