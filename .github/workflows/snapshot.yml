name: options-snapshot

# Three evening passes, in UTC. Each only replaces a day's file with a better
# snapshot, so extra or late runs are harmless.
#   21:30  ->  5:30 PM New York in summer time, 4:30 PM in winter
#   23:00  ->  7:00 PM / 6:00 PM
#   00:10  ->  8:10 PM / 7:10 PM (previous New York day). Final pass: also
#              fails the run if any symbol is missing today's close.
on:
  schedule:
    - cron: "30 21 * * 1-5"
    - cron: "0 23 * * 1-5"
    - cron: "10 0 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - snapshot.py
      - symbols.txt
      - requirements.txt
      - .github/workflows/snapshot.yml

permissions:
  contents: write

concurrency:
  group: options-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Take snapshots
        id: snap
        continue-on-error: true
        run: |
          if [ "${{ github.event.schedule }}" = "10 0 * * 2-6" ]; then
            python snapshot.py --require-close
          else
            python snapshot.py
          fi

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 10
          done
          exit 1

      - name: Fail the run if any symbol failed
        if: steps.snap.outcome == 'failure'
        run: |
          echo "One or more symbols failed. See the Take snapshots step."
          exit 1
